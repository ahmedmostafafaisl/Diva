server {
    listen 8000;
    server_name localhost;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    # Define access log location specific to this site
    access_log /var/log/nginx/php_access.log;

    # Define error log location specific to this site
    error_log /var/log/nginx/php_error.log error;

    # Main location block (for static files and routing to PHP)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP handling with TCP connection to PHP-FPM
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;  # Using TCP to communicate with PHP-FPM
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;  # Safer than $realpath_root
        include fastcgi_params;
    }

    # Security: Deny access to hidden files except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Optional: Caching for static files (images, CSS, JS)
    location ~* \.(jpg|jpeg|png|gif|css|js|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }
}
